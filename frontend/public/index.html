<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <title>Hospital Management System</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
      /* Custom styles */
      .loading-spinner {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 9999;
      }
      
      .navbar-brand {
        font-weight: 600;
      }
      
      .app-footer {
        margin-top: auto;
      }
      
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      
      ::-webkit-scrollbar-thumb {
        background: #888;
        border-radius: 4px;
      }
      
      ::-webkit-scrollbar-thumb:hover {
        background: #555;
      }
      
      /* Print styles */
      @media print {
        .no-print {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <noscript>
      <div class="alert alert-danger m-3">
        <strong>We're sorry but Hospital Management System doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
      </div>
    </noscript>
    
    <!-- Loading Spinner -->
    <div id="loading-spinner" class="loading-spinner no-print">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
    
    <!-- Vue App Mount Point -->
    <div id="app"></div>
    
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom Script for Loading Spinner -->
    <script>
      
      window.addEventListener('load', function() {
        document.getElementById('loading-spinner').style.display = 'none';
      });
      
      
      document.addEventListener('vue-router:navigate', function() {
        document.getElementById('loading-spinner').style.display = 'block';
      });
      
      
      window.addEventListener('error', function(e) {
        console.error('Application error:', e.error);
        document.getElementById('loading-spinner').style.display = 'none';
      });
    </script>
  </body>
</html>
